name: build and test

on:
  push:
    branches: [ main, lab1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FoodDelivery.slnx

      - name: Build
        run: dotnet build FoodDelivery.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FoodDelivery.slnx --no-build --configuration Release
